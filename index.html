<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고사성어 그랑프리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#3fb6ff; --sky2:#9be3ff; --grass:#5cc85a; --grass-d:#3c9b3e;
  --yellow:#ffd23f; --yellow-d:#e0a800; --orange:#ff7a3d; --orange-d:#d4551d;
  --red:#ff4d5e; --red-d:#c92a3a; --blue:#2f7cff; --blue-d:#1b55c4;
  --green:#2fc37a; --green-d:#1f9157; --purple:#8b5cf6; --purple-d:#6236c9;
  --ink:#1d2a44; --muted:#5d6b85; --card:#ffffff; --line:#e3e9f3;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Noto Sans KR',sans-serif; color:var(--ink); min-height:100vh;
  background:
    radial-gradient(ellipse 120px 40px at 12% 14%, #fff 60%, transparent 62%),
    radial-gradient(ellipse 90px 30px at 18% 11%, #fff 60%, transparent 62%),
    radial-gradient(ellipse 140px 44px at 82% 22%, #fff 60%, transparent 62%),
    radial-gradient(ellipse 80px 28px at 76% 19%, #fff 60%, transparent 62%),
    linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 70%,#c9f1ff 100%);
  background-attachment:fixed;
}
body.hard{background:linear-gradient(180deg,#5b7fa6 0%,#a9c1d6 60%,#e3edf5 100%);background-attachment:fixed}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:70px;z-index:-1;background:linear-gradient(180deg,var(--grass),var(--grass-d));}
body.hard::after{background:linear-gradient(180deg,#8d9aa6,#6b7784)}
h1,h2,h3,.disp{font-family:'Jua',sans-serif;font-weight:400;letter-spacing:.5px}
button{font-family:'Jua',sans-serif;cursor:pointer;border:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 110px}

.top{position:sticky;top:0;z-index:20;padding:10px 16px;background:rgba(20,40,80,.6);backdrop-filter:blur(8px)}
.top-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-family:'Jua';font-size:24px;color:var(--yellow);text-shadow:0 3px 0 #b36b00;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.pills{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.pill{background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.nav{display:flex;gap:6px;width:100%;margin-top:4px}
.nav button{flex:1;background:rgba(255,255,255,.15);color:#fff;border-radius:12px;padding:8px 4px;font-size:16px;white-space:nowrap}
.nav button.on{background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 var(--yellow-d)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:16px;padding:12px 20px;font-size:19px;color:#fff;background:var(--blue);box-shadow:0 6px 0 var(--blue-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--blue-d)}
.btn.y{background:var(--yellow);color:var(--ink);box-shadow:0 6px 0 var(--yellow-d)}
.btn.o{background:var(--orange);box-shadow:0 6px 0 var(--orange-d)}
.btn.r{background:var(--red);box-shadow:0 6px 0 var(--red-d)}
.btn.g{background:var(--green);box-shadow:0 6px 0 var(--green-d)}
.btn.p{background:var(--purple);box-shadow:0 6px 0 var(--purple-d)}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 6px 0 #c4cfdf}
.btn.sm{font-size:15px;padding:8px 14px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.panel{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 8px 0 rgba(20,40,80,.15),0 12px 30px rgba(20,40,80,.12);border:3px solid #fff}
.sec-title{color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);font-size:28px;margin:22px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* 로그인 */
.hero{text-align:center;padding:24px 0 6px}
.hero h1{font-size:clamp(40px,9vw,68px);margin:0;color:var(--yellow);text-shadow:0 5px 0 #b35c00,0 9px 0 rgba(0,0,0,.2);-webkit-text-stroke:2px #7a3a00}
.hero p{color:#fff;font-size:18px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.login{max-width:420px;margin:10px auto}
.inp{width:100%;font-size:18px;padding:12px 14px;border-radius:14px;border:3px solid var(--line);font-family:inherit;outline:none}
.inp:focus{border-color:var(--blue)}
.users{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.uchip{background:#eef4ff;border-radius:999px;padding:6px 12px;font-weight:800;cursor:pointer;border:2px solid #d5e3ff;font-size:14px}

/* 차고(내 레이서) */
.garage{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:center;padding:14px}
.scene{border-radius:18px;overflow:hidden;line-height:0}
.scene svg{width:100%;height:auto;display:block}
.lv{display:inline-block;font-family:'Jua';background:var(--ink);color:var(--yellow);border-radius:10px;padding:2px 10px;font-size:16px}
.ginfo h2{margin:6px 0 2px;font-size:30px}
.nextbox{background:#f4f7fc;border-radius:14px;padding:10px 12px;margin-top:10px;font-size:14px;font-weight:700;display:flex;gap:10px;align-items:center}
.nextbox svg{flex:none}

/* 존 탭 & 노드 카드 */
.ztabs{display:flex;gap:8px;margin:18px 0 12px;flex-wrap:wrap}
.ztabs button{border-radius:14px;padding:10px 16px;font-size:17px;background:rgba(255,255,255,.35);color:#fff}
.ztabs button.on{background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.15)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ncard{position:relative;overflow:hidden;padding:16px}
.ncard .num{position:absolute;right:-4px;top:-16px;font-family:'Jua';font-size:80px;color:#eef3fb;z-index:0}
.ncard>*{position:relative;z-index:1}
.ncard h3{margin:0 0 2px;font-size:22px}
.ncard .range{color:var(--muted);font-weight:600;font-size:14px}
.ncard.locked{opacity:.6;filter:grayscale(.5)}
.ncard.now{outline:4px solid var(--yellow);outline-offset:-2px}
.ncard.cp{background:repeating-linear-gradient(135deg,#fff 0 18px,#fff7e0 18px 36px)}
.ncard.final{background:linear-gradient(135deg,#fff8d6,#ffe9a8);border-color:#ffd23f}
.ncard.final.z1{background:linear-gradient(135deg,#efe9ff,#d9ccff);border-color:#b9a3ff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:#eef1f6;color:var(--muted)}
.chip.ok{background:#dcf7e8;color:#16804b}
.chip.gold{background:#fff3c4;color:#8a6400}
.bar{height:12px;background:#e9eef6;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:99px}
.medal-big{position:absolute;right:12px;bottom:10px;font-size:34px;z-index:2}

/* 플래시카드 */
.study-hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 10px;color:#fff;font-weight:800}
.study-hud .big{font-family:'Jua';font-size:26px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.flip{perspective:1400px;max-width:560px;margin:0 auto;height:470px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;background:#fff;border:4px solid #fff;box-shadow:0 10px 0 rgba(20,40,80,.18),0 18px 40px rgba(20,40,80,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
.face.front{background:linear-gradient(160deg,#fffdf2,#fff3c8)}
.face.front.hardc{background:linear-gradient(160deg,#f3f0ff,#dfe8f5)}
.face.back{transform:rotateY(180deg);justify-content:flex-start;overflow:auto;text-align:left;align-items:stretch}
.idiom{font-family:'Jua';font-size:clamp(46px,12vw,74px);line-height:1.1;color:var(--ink)}
.hanja{font-family:'Noto Serif KR',serif;font-size:clamp(28px,7vw,40px);color:#b3441e;letter-spacing:6px;margin-top:6px}
.tap{margin-top:22px;color:var(--muted);font-weight:700;font-size:14px}
.step{display:flex;gap:10px;align-items:flex-start;margin:6px 0 10px}
.step .k{flex:none;font-family:'Jua';font-size:13px;background:var(--ink);color:#fff;border-radius:8px;padding:3px 8px;margin-top:2px}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.ch{background:#fff7e6;border:2px solid #ffe0a3;border-radius:14px;padding:6px 2px;text-align:center}
.ch b{display:block;font-family:'Noto Serif KR',serif;font-size:28px;color:#b3441e;line-height:1.2}
.ch span{font-size:13px;font-weight:800}
.arrow{text-align:center;color:var(--orange);font-weight:900;margin:2px 0}
.lit{background:#eef5ff;border-radius:14px;padding:10px 12px;font-weight:800;text-align:center}
.mean{background:#e6f9ef;border-radius:14px;padding:10px 12px;font-weight:800;font-size:17px;text-align:center;color:#14633b}
.ex{background:#f5f1ff;border-radius:14px;padding:10px 12px;line-height:1.6}
.ex mark,.sent mark{background:var(--yellow);border-radius:4px;padding:0 2px;font-weight:800}
.back-head{display:flex;align-items:baseline;gap:10px;justify-content:center;margin-bottom:8px}
.back-head .idiom{font-size:36px}
.back-head .hanja{font-size:22px;margin:0;letter-spacing:3px}
.answer-row{display:flex;gap:14px;justify-content:center;margin:26px auto 0;max-width:560px}
.answer-row .btn{flex:1;font-size:21px;padding:16px 10px}
.queue{display:flex;gap:4px;justify-content:center;margin:14px auto 0;flex-wrap:wrap;max-width:560px}
.queue i{width:16px;height:16px;border-radius:5px;background:rgba(255,255,255,.5)}
.queue i.k{background:var(--green)} .queue i.u{background:var(--red)}

/* 퀴즈 */
.qwrap{max-width:640px;margin:0 auto}
.qhead{color:#fff;font-family:'Jua';font-size:24px;text-shadow:0 3px 0 rgba(0,0,0,.25);margin:18px 0 0}
.stage-tabs{display:flex;gap:6px;margin:10px 0 12px}
.stage-tabs div{flex:1;text-align:center;font-family:'Jua';font-size:14px;padding:8px 4px;border-radius:12px;background:rgba(255,255,255,.35);color:#fff}
.stage-tabs div.on{background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 var(--yellow-d)}
.stage-tabs div.done{background:var(--green)}
.qnum{font-family:'Jua';color:var(--orange);font-size:18px}
.qtext{font-size:21px;font-weight:800;margin:8px 0 16px;line-height:1.5}
.opts{display:grid;gap:10px}
.opt{text-align:left;font-family:'Noto Sans KR';font-weight:700;font-size:17px;padding:14px 16px;border-radius:16px;background:#f3f6fb;border:3px solid #e1e8f3;color:var(--ink)}
.opt:hover{border-color:var(--blue)}
.opt.right{background:#dcf7e8;border-color:var(--green)}
.opt.wrong{background:#ffe1e4;border-color:var(--red)}
.cho{display:flex;gap:8px;justify-content:center;margin:6px 0 16px}
.cho span{width:56px;height:56px;border-radius:14px;background:var(--ink);color:var(--yellow);font-family:'Jua';font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #0b1426}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;font-weight:700;line-height:1.6}
.fb.good{background:#dcf7e8;color:#14633b}
.fb.bad{background:#ffe1e4;color:#8f1d2a}
.fb h4{margin:0 0 4px;font-family:'Jua';font-weight:400;font-size:22px}
textarea.inp{min-height:110px;resize:vertical;line-height:1.6}

/* 결과 */
.result{text-align:center}
.score{font-family:'Jua';font-size:84px;line-height:1;color:var(--orange);text-shadow:0 5px 0 #f3d1bd}
.medal{width:160px;height:160px;margin:14px auto;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Jua';animation:pop .6s cubic-bezier(.3,1.6,.5,1);font-size:76px;line-height:1}
.medal small{font-size:16px;margin-top:4px}
.medal.m1{background:radial-gradient(circle at 35% 30%,#f6cfa7,#d08a4c 65%);box-shadow:0 0 0 8px #f4d6b8}
.medal.m2{background:radial-gradient(circle at 35% 30%,#fff,#b8c2d0 65%);box-shadow:0 0 0 8px #e3e8f0}
.medal.m3{background:radial-gradient(circle at 35% 30%,#fff1a8,#f5b400 65%);box-shadow:0 0 0 8px #ffe9a3}
.medal.m4{background:radial-gradient(circle at 35% 30%,#e7dcff,#8b5cf6 65%);box-shadow:0 0 0 8px #d9ccff,0 0 40px #ffd23f}
.medal.m0{background:#e3e8f0;font-size:56px}
@keyframes pop{0%{transform:scale(2.4) rotate(-30deg);opacity:0}100%{transform:scale(1);opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.review-list{text-align:left;margin-top:12px;max-height:320px;overflow:auto}
.review-list div{padding:8px 10px;border-radius:10px;margin:4px 0;font-weight:600;font-size:14px}
.review-list .o{background:#eefbf3} .review-list .x{background:#fff0f2}

/* 레이스 현황판 */
.live{font-size:14px;background:var(--red);color:#fff;border-radius:999px;padding:3px 10px;text-shadow:none;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.45}}
.race{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.track-box{border-radius:28px;border:4px solid #fff;box-shadow:0 8px 0 rgba(20,40,80,.15);overflow:hidden;background:#6fcf6a}
.track-box.mtn{background:#9fb1bf}
.track-box svg{display:block;width:100%;height:auto}
.dash{animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-34}}
.bob{animation:bob .9s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.pulse{animation:pulse 1.3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.8);opacity:0}}
.board{display:grid;gap:6px;max-height:520px;overflow:auto}
.brow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:14px;background:#f4f7fc;font-weight:700;font-size:14px}
.brow.me{background:#fff3c4;outline:3px solid var(--yellow)}
.brow .rk{width:30px;font-family:'Jua';font-size:20px;text-align:center}
.brow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .nm small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.brow .md{font-size:12px;white-space:nowrap}
.myrank{display:flex;align-items:center;gap:14px}
.myrank .big{font-family:'Jua';font-size:46px;color:var(--orange);line-height:1}

/* 사전 */
.dict{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ditem{background:#fff;border-radius:18px;padding:14px;box-shadow:0 5px 0 rgba(20,40,80,.1);cursor:pointer}
.ditem h3{margin:0;font-size:24px}
.ditem .hj{font-family:'Noto Serif KR';color:#b3441e;letter-spacing:3px}
.ditem p{margin:6px 0 0;font-size:14px;line-height:1.5}

.modal{position:fixed;inset:0;background:rgba(10,20,40,.6);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .panel{max-width:540px;width:100%;max-height:92vh;overflow:auto}
.lvup{text-align:center}
.lvup h1{font-size:44px;margin:0;color:var(--orange);text-shadow:0 4px 0 #ffd9c4}
.lvup .ba{display:flex;align-items:center;justify-content:center;gap:8px;font-size:30px}

@media (max-width:760px){
  .race,.garage{grid-template-columns:1fr}
  .flip{height:500px}
  .nav button{font-size:14px}
  .sec-title{font-size:23px}
}
</style>
</head>
<body>
<div id="top"></div>
<div class="wrap" id="app"></div>
<div id="layer"></div>

<script src="data.js"></script>
<script src="config.js"></script>
<script src="game.js"></script>
<script>
// ===== 저장소 =====
const KEY = 'gosa_grandprix_v1';
function loadDB() {
  let db;
  try { db = JSON.parse(localStorage.getItem(KEY)) || { users: {}, cur: null }; }
  catch (e) { db = { users: {}, cur: null }; }
  // 선생님이 config.js의 RESET_ID를 바꾸면 이 기기의 기록을 모두 지운다
  const reset = typeof RESET_ID === 'string' ? RESET_ID : '';
  if ((db.reset || '') !== reset) db = { users: {}, cur: null, reset };
  // 이전 버전(코스 번호 키) 기록을 노드 키로 옮김
  Object.values(db.users).forEach(u => Object.keys(u.sets || {}).forEach(k => {
    if (/^\d+$/.test(k)) { u.sets['c' + k] = u.sets[k]; delete u.sets[k]; }
  }));
  return db;
}
let DB = loadDB();
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }
function me() { return DB.users[DB.cur]; }
function rec(id) {
  const u = me();
  u.sets[id] = u.sets[id] || { studied: 0, studyCount: 0, best: 0, stamp: 0, attempts: [] };
  return u.sets[id];
}
function newUser(name) { return { id: name, name, known: {}, unknown: {}, wrong: {}, sentences: [], sets: {}, days: [], created: Date.now() }; }
function today() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function logDay() { const u = me(); if (!u.days.includes(today())) u.days.push(today()); }

// ===== 구글 시트 연동 (config.js의 SYNC_URL) =====
const SYNC = typeof SYNC_URL === 'string' && SYNC_URL.trim();
function sync() {
  if (!SYNC || !me()) return;
  const body = JSON.stringify(Object.assign({}, me(), { sentences: me().sentences.slice(0, 30), pub: pubOf(me()) }));
  // text/plain으로 보내야 Apps Script가 CORS 사전 요청 없이 받는다
  fetch(SYNC, { method: 'POST', body, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, keepalive: true })
    .then(r => r.json()).then(j => { if (j.removed) return removedByTeacher(DB.cur); if (!j.ok) toast('⚠️ 기록 저장 실패'); RACE.at = 0; })
    .catch(() => toast('⚠️ 인터넷 연결을 확인해 주세요 (기록은 이 기기에 보관 중)'));
}
async function loadRemote(name) {
  if (!SYNC) return null;
  try { return (await (await fetch(`${SYNC}?action=load&name=${encodeURIComponent(name)}`)).json()).data; }
  catch (e) { return null; }
}
let RACE = { list: null, at: 0 };
async function fetchRace() {
  if (!SYNC) return [];
  if (RACE.list && Date.now() - RACE.at < 20000) return RACE.list;
  try {
    const j = await (await fetch(`${SYNC}?action=race`)).json();
    RACE = { list: j.racers || [], at: Date.now() };
    pruneDeleted(j.reset || 0, j.deleted || {});
  } catch (e) { RACE.list = RACE.list || []; }
  return RACE.list;
}
// 선생님이 삭제한 기록(전체 초기화 이전 또는 개별 삭제 이전에 만든 레이서)은 이 기기에서도 지운다
function pruneDeleted(reset, deleted) {
  const gone = Object.values(DB.users).filter(u => (u.created || 0) < Math.max(reset, deleted[u.name] || 0)).map(u => u.id);
  if (!gone.length) return;
  const curGone = gone.includes(DB.cur);
  gone.forEach(id => delete DB.users[id]);
  if (curGone) removedByTeacher(null); else save();
}
function removedByTeacher(id) {
  if (id) delete DB.users[id];
  DB.cur = null; save();
  alert('선생님이 레이스 기록을 초기화했어요.\n이름이나 닉네임을 입력해서 새로 출발해 주세요!');
  VIEW = 'home'; renderLogin();
}
function toast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:rgba(20,30,50,.92);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:90;font-size:14px;max-width:90vw;text-align:center';
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

// ===== 유틸 =====
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).replace(/[\s.,!?·'"]/g, '');
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const chosung = w => [...w].map(ch => { const c = ch.charCodeAt(0) - 0xAC00; return c >= 0 && c < 11172 ? CHO[Math.floor(c / 588)] : ch; });
const hl = (text, w) => esc(text).split(esc(w)).join(`<mark>${esc(w)}</mark>`);
const rangeText = n => n.type === 'course' ? `${COURSES[n.course][0].w} ~ ${COURSES[n.course].at(-1).w}` : `코스 ${n.from + 1}~${n.to + 1} 전체 범위`;
let VIEW = 'home';

// ===== 상단 바 =====
function renderTop() {
  const u = me();
  if (!u) { $('#top').innerHTML = ''; return; }
  const t = tierOf(u), m = medalCounts(u);
  document.body.classList.toggle('hard', progressOf(u) >= NODES_PER_ZONE);
  const tabs = [['home', '🏁 코스'], ['race', '🏎️ 레이스 현황'], ['dict', '📖 사전']];
  $('#top').innerHTML = `<div class="top"><div class="top-in">
    <div class="logo" onclick="go('home')">🏎️ 고사성어 그랑프리</div>
    <div class="pills">
      <div class="pill">Lv.${t + 1} ${TIERS[t].name}</div>
      <div class="pill" title="알아요로 체크한 고사성어">🪙 ${Object.keys(u.known).length}</div>
      <div class="pill" title="메달">🥉${m[1]} 🥈${m[2]} 🥇${m[3]} 🏆${m[4]}</div>
      <div class="pill" style="cursor:pointer" onclick="logout()" title="레이서 바꾸기">👤 ${esc(u.name)} ↩</div>
    </div>
    <nav class="nav">${tabs.map(([k, l]) => `<button class="${VIEW === k ? 'on' : ''}" onclick="go('${k}')">${l}</button>`).join('')}</nav>
  </div></div>`;
}
function go(v) {
  VIEW = v; renderTop(); window.scrollTo(0, 0);
  ({ home: renderHome, race: renderRace, dict: renderDict })[v]();
}

// ===== 로그인 (이름/닉네임) =====
function renderLogin() {
  renderTop();
  const list = Object.values(DB.users);
  $('#app').innerHTML = `
  <div class="hero">
    ${racerSVG(0, 150)}
    <h1>고사성어 그랑프리</h1>

    <p class="muted" style="margin:0 0 10px;font-size:14px;font-weight:700">이름이나 닉네임을 입력하세요. 레이스 현황판에 이 이름으로 표시돼요.</p>
    <input class="inp" id="sname" maxlength="12" placeholder="예) 번개거북이" onkeydown="if(event.key==='Enter')login()">

      <div class="users">${list.map(u => `<span class="uchip" onclick="pickUser(this.dataset.n)" data-n="${esc(u.id)}">${esc(u.name)}</span>`).join('')}</div>` : ''}

function pickUser(n) { DB.cur = n; save(); go('home'); }
async function login() {
  const name = $('#sname').value.trim().replace(/\s+/g, ' ');
  if (!name) { alert('이름이나 닉네임을 입력해 주세요.'); return; }
  if (!DB.users[name]) {
    const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = '레이서 확인 중...';
    const remote = await loadRemote(name);
    if (remote) {
      if (!confirm(`‘${name}’ 레이서의 기록이 이미 있어요.\n\n내 기록이 맞으면 [확인]을 눌러 이어서 달리고,\n처음이라면 [취소]를 누른 뒤 다른 닉네임을 써 주세요.`)) {
        btn.disabled = false; btn.textContent = '🏁 출발하기'; $('#sname').select(); return;
      }
      DB.users[name] = Object.assign(newUser(name), remote);
      toast('☁️ 이전 레이스 기록을 불러왔어요');
    } else {
      DB.users[name] = newUser(name);
    }
  }
  DB.cur = name; save(); sync(); go('home');
}
function logout() { DB.cur = null; save(); renderLogin(); }

// ===== 레벨별 배경 =====
function sceneSVG(t) {
  const bgs = [
    ['#5cc3ff', '#c9f1ff'], ['#ff9a5c', '#ffd8a8'], ['#4b3f8f', '#c58ad8'], ['#7fb7e6', '#dbeefa'],
    ['#9fb8d0', '#f2f7fb'], ['#0d1a3a', '#25407a'], ['#ffb300', '#fff1b8']
  ][t];
  let s = `<svg viewBox="0 0 320 180"><defs><linearGradient id="sg${t}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${bgs[0]}"/><stop offset="1" stop-color="${bgs[1]}"/></linearGradient></defs>
    <rect width="320" height="180" fill="url(#sg${t})"/>`;
  if (t === 0) s += `<ellipse cx="60" cy="30" rx="34" ry="11" fill="#fff"/><ellipse cx="250" cy="44" rx="40" ry="12" fill="#fff"/><path d="M0 130 Q80 100 160 125 T320 120 V180 H0Z" fill="#7bd36f"/>`;
  if (t === 1) s += `<circle cx="160" cy="110" r="42" fill="#ffe27a"/><path d="M0 128 Q90 104 170 126 T320 118 V180 H0Z" fill="#c9733f"/>`;
  if (t === 2) s += `${[40, 280].map(x => `<rect x="${x}" y="40" width="6" height="90" fill="#2a2450"/><circle cx="${x + 3}" cy="40" r="10" fill="#fff6b0"/><circle cx="${x + 3}" cy="40" r="26" fill="#fff6b0" opacity=".25"/>`).join('')}
    <rect x="70" y="92" width="180" height="36" fill="#2a2450"/>${Array.from({ length: 40 }, (_, i) => `<circle cx="${78 + (i % 20) * 8.6}" cy="${100 + Math.floor(i / 20) * 12}" r="3" fill="${['#ffd23f', '#ff4d5e', '#9be3ff', '#fff'][i % 4]}"/>`).join('')}`;
  if (t === 3 || t === 4) s += `<path d="M-10 140 L60 60 L120 140Z M80 140 L170 40 L260 140Z M200 140 L270 70 L340 140Z" fill="${t === 3 ? '#7d8fa3' : '#9aa9bb'}"/>
    <path d="M60 60 L48 74 L72 74Z M170 40 L152 60 L188 60Z M270 70 L258 84 L282 84Z" fill="#fff"/>
    ${t === 4 ? Array.from({ length: 24 }, (_, i) => `<circle cx="${(i * 53) % 320}" cy="${(i * 37) % 120}" r="2.5" fill="#fff"/>`).join('') : ''}
    ${[20, 100, 240, 300].map(x => `<path d="M${x} 150 l12 -30 l12 30Z" fill="#2f6b4a"/>`).join('')}`;
  if (t === 5) s += `${Array.from({ length: 30 }, (_, i) => `<circle cx="${(i * 71) % 320}" cy="${(i * 29) % 110}" r="1.6" fill="#fff"/>`).join('')}
    <path d="M0 70 Q80 30 160 60 T320 40" stroke="#4dffb0" stroke-width="18" fill="none" opacity=".35"/><path d="M0 130 Q100 110 200 128 T320 122 V180 H0Z" fill="#14244d"/>`;
  if (t === 6) s += `${[[60, 40], [260, 36], [160, 22]].map(([x, y]) => Array.from({ length: 10 }, (_, i) => `<line x1="${x}" y1="${y}" x2="${x + Math.cos(i / 10 * 6.28) * 22}" y2="${y + Math.sin(i / 10 * 6.28) * 22}" stroke="${['#ff4d5e', '#fff', '#8b5cf6'][i % 3]}" stroke-width="3"/>`).join('')).join('')}
    <rect x="232" y="104" width="70" height="40" fill="#c78f00"/><text x="267" y="132" text-anchor="middle" font-family="Jua" font-size="20" fill="#fff">1</text>
    <path d="M252 76 h30 v8 q0 18 -15 20 q-15 -2 -15 -20Z M262 104 h10 v6 h-10Z" fill="#ffe27a" stroke="#b37a00" stroke-width="2"/>`;
  s += `<rect y="150" width="320" height="30" fill="${t >= 3 && t <= 4 ? '#8a6a45' : t === 5 ? '#0b1530' : '#596579'}"/><path d="M0 165 H320" stroke="#fff" stroke-width="3" stroke-dasharray="16 14" opacity=".7"/>`;
  s += racerSVG(t, 150, 85, 52);
  return s + '</svg>';
}

// ===== 홈: 차고 + 코스 지도 =====
let ZONE_VIEW = null;
function garageHTML(u) {
  const t = tierOf(u), p = progressOf(u);
  const nextIdx = NODES.findIndex((n, i) => i >= p && n.type !== 'course');
  return `<div class="panel garage">
    <div class="scene">${sceneSVG(t)}</div>
    <div class="ginfo">
      <span class="lv">Lv.${t + 1}</span>
      <h2>${TIERS[t].name}</h2>
      <div style="font-weight:800">${esc(u.name)} 레이서</div>
      <div class="bar" style="margin:10px 0 4px"><i style="width:${p / NODES.length * 100}%"></i></div>
      <div class="muted" style="font-size:13px;font-weight:700">전체 레이스 진행 ${p} / ${NODES.length} 체크포인트</div>
      ${t < TIERS.length - 1 ? `<div class="nextbox">${racerSVG(t + 1, 58)}<div>다음 레벨 보상 · <b>${TIERS[t + 1].reward}</b><br><span class="muted">‘${NODES[nextIdx].label}’ 통과 시 획득</span></div></div>`

      ${p < NODES.length ? `<div style="margin-top:12px"><button class="btn o" onclick="startNode('${NODES[p].id}')">▶ ${NODES[p].label} 출발</button></div>` : ''}

function renderHome() {
  const u = me(), p = progressOf(u);
  if (ZONE_VIEW === null) ZONE_VIEW = p >= NODES_PER_ZONE ? 1 : 0;
  const z = ZONE_VIEW, zoneOpen = z === 0 || p >= NODES_PER_ZONE;
  $('#app').innerHTML = `
  <h2 class="sec-title">🏠 내 차고</h2>
  ${garageHTML(u)}
  <div class="ztabs">${ZONES.map((zz, i) => `<button class="${i === z ? 'on' : ''}" onclick="ZONE_VIEW=${i};renderHome()">${zz.icon} ${zz.name}${i === 1 && p < NODES_PER_ZONE ? ' 🔒' : ''}</button>`).join('')}</div>
  ${!zoneOpen ? `<div class="panel" style="margin-bottom:14px;text-align:center"><h3 style="margin:0">🔒 하드 코스는 서킷 리그 ‘레벨업 테스트’를 통과하면 열려요!</h3><p class="muted" style="margin:6px 0 0">고등학교 수준 고사성어 150개가 산악 랠리 코스에서 기다리고 있어요.</p></div>` : ''}
  <div class="grid">${NODES.map((n, i) => n.zone === z ? nodeCard(n, i, u, p) : '').join('')}</div>`;
}
function nodeCard(n, i, u, p) {
  const r = u.sets[n.id] || {};
  const locked = i > p, now = i === p;
  const cls = `panel ncard ${n.type} z${n.zone} ${locked ? 'locked' : ''} ${now ? 'now' : ''}`;
  const medal = r.stamp ? `<div class="medal-big">${MEDALS[r.stamp].icon}</div>` : locked ? '<div class="medal-big">🔒</div>' : '';
  const score = `<span class="chip ${r.best >= PASS ? 'gold' : ''}">최고 ${r.best || 0}점</span>`;
  if (n.type === 'course') {
    const set = COURSES[n.course], k = set.filter(d => u.known[d.w]).length;
    return `<div class="${cls}"><div class="num">${n.course + 1}</div>
      <h3>코스 ${n.course + 1}</h3><div class="range">${rangeText(n)}</div>
      <div class="chips"><span class="chip ${r.studied ? 'ok' : ''}">${r.studied ? '✓ 학습 완주' : '학습 전'}</span>${score}</div>
      <div class="bar"><i style="width:${k / set.length * 100}%"></i></div>
      <div class="muted" style="font-size:13px;font-weight:700;margin:4px 0 12px">알아요 ${k}/${set.length}</div>
      <div class="row"><button class="btn sm" ${locked ? 'disabled' : ''} onclick="startStudy(${n.course})">📚 학습하기</button>
        <button class="btn sm o" ${locked || !r.studied ? 'disabled' : ''} onclick="startQuiz('${n.id}')">✏️ 체크 문제</button></div>${medal}</div>`;
  }
  const qn = QUIZ_PLAN[n.type].reduce((a, b) => a + b, 0);
  return `<div class="${cls}">
    <h3>${n.short}</h3><div class="range">${rangeText(n)} · ${qn}문항</div>
    <div class="chips"><span class="chip">${PASS}점 이상 통과</span>${score}<span class="chip">🎁 ${TIERS[NODES.slice(0, i + 1).filter(x => x.type !== 'course').length].reward}</span></div>
    <p class="muted" style="font-size:13px;font-weight:700;margin:4px 0 12px">${n.type === 'cp' ? '앞의 다섯 코스를 섞어서 출제해요. 통과해야 다음 코스가 열려요!' : n.zone === 0 ? '코스 1~10 전체를 섞어서 출제! 통과하면 레벨업 + 하드 코스(산악 랠리) 입장!' : '하드 코스 전체를 섞어서 출제! 통과하면 고사성어 마스터!'}</p>
    <button class="btn sm ${n.type === 'final' ? 'p' : 'o'}" ${locked ? 'disabled' : ''} onclick="startQuiz('${n.id}')">${n.type === 'cp' ? '🚩 중간 점검 응시' : '🏁 테스트 응시'}</button>${medal}</div>`;
}
function startNode(id) {
  const n = NODES[NODE_IDX[id]];
  if (n.type === 'course' && !(me().sets[id] || {}).studied) startStudy(n.course); else startQuiz(id);
}

// ===== 학습하기 (플래시카드) =====
let S = null;
function startStudy(c) {
  VIEW = 'study'; renderTop(); window.scrollTo(0, 0);
  S = { course: c, queue: shuffle(COURSES[c].map(d => d.id)), state: {}, flipped: false };
  logDay(); save();
  renderStudy();
}
function cardBack(d) {
  return `<div class="back-head"><span class="idiom">${d.w}</span><span class="hanja">${d.h}</span></div>
    <div class="step"><span class="k">① 한자 풀이</span></div>
    <div class="chars">${d.c.map((c, k) => `<div class="ch"><b>${[...d.h][k]}</b><span>${esc(c)}</span></div>`).join('')}</div>
    <div class="arrow">▼</div>
    <div class="step"><span class="k">② 글자 뜻</span></div>
    <div class="lit">${esc(d.l)}</div>
    <div class="arrow">▼</div>
    <div class="step"><span class="k">③ 의미</span></div>
    <div class="mean">${esc(d.m)}</div>
    <div class="step" style="margin-top:12px"><span class="k">④ 예문</span></div>
    <div class="ex">${hl(d.e, d.w)}</div>`;
}
function renderStudy() {
  if (!S.queue.length) return studyDone();
  const d = DATA[S.queue[0]], set = COURSES[S.course];
  const done = set.filter(x => S.state[x.id] === 'k').length;
  $('#app').innerHTML = `
  <div class="study-hud">
    <div><div class="big">코스 ${S.course + 1} 학습${d.hard ? ' ⛰️' : ''}</div>남은 카드 ${S.queue.length}장</div>
    <button class="btn w sm" onclick="if(confirm('학습을 그만두고 코스 목록으로 갈까요?'))go('home')">✕ 나가기</button>
  </div>
  <div class="bar" style="max-width:560px;margin:0 auto 14px;height:14px"><i style="width:${done / set.length * 100}%"></i></div>
  <div class="flip ${S.flipped ? 'on' : ''}" id="flip" onclick="flipCard()">
    <div class="flip-in">
      <div class="face front ${d.hard ? 'hardc' : ''}">
        <div class="idiom">${d.w}</div>
        <div class="hanja">${d.h}</div>
        <div class="tap">👆 카드를 눌러 뜻을 확인하세요 (스페이스바)</div>
      </div>
      <div class="face back">${cardBack(d)}</div>
    </div>
  </div>
  <div class="answer-row">
    <button class="btn r" onclick="answerCard(false)">🤔 아직 몰라요</button>
    <button class="btn g" onclick="answerCard(true)">😎 알아요</button>
  </div>
  <div class="queue">${set.map(x => `<i class="${S.state[x.id] || ''}"></i>`).join('')}</div>
  <p style="text-align:center;color:#fff;font-weight:700;font-size:14px;text-shadow:0 1px 0 rgba(0,0,0,.3)">'아직 몰라요'를 누른 카드는 맨 뒤로 가서 다시 나와요. ← 몰라요 / → 알아요</p>`;
}
function flipCard() { S.flipped = !S.flipped; $('#flip').classList.toggle('on', S.flipped); }
function answerCard(know) {
  const u = me(), id = S.queue.shift(), d = DATA[id];
  if (know) { S.state[id] = 'k'; u.known[d.w] = true; }
  else {
    S.state[id] = 'u';
    u.unknown[d.w] = (u.unknown[d.w] || 0) + 1;
    delete u.known[d.w];
    S.queue.push(id);
  }
  S.flipped = false; save(); renderTop(); renderStudy();
}
function studyDone() {
  const r = rec('c' + S.course); r.studied = 1; r.studyCount++; save(); sync(); renderTop();
  burst();
  $('#app').innerHTML = `<div class="panel result" style="max-width:560px;margin:30px auto">
    ${racerSVG(tierOf(me()), 130)}
    <h1 style="margin:6px 0">코스 ${S.course + 1} 학습 완주! 🎉</h1>
    <p class="muted" style="font-weight:700">15개 고사성어를 모두 '알아요'로 만들었어요.<br>이제 체크 문제를 풀고 메달을 따 보세요!</p>
    <div class="row" style="justify-content:center;margin-top:12px">
      <button class="btn o" onclick="startQuiz('c${S.course}')">✏️ 체크 문제 풀기</button>
      <button class="btn w" onclick="startStudy(${S.course})">🔁 한 번 더 학습</button>
    </div></div>`;
}

// ===== 체크 문제 / 중간 점검 / 레벨업 테스트 =====
let Q = null;
function startQuiz(id) {
  const n = NODES[NODE_IDX[id]];
  VIEW = 'quiz'; renderTop(); window.scrollTo(0, 0);
  const pool = shuffle(nodePool(n)), plan = QUIZ_PLAN[n.type];
  const qs = []; let p = 0;
  plan.forEach((cnt, si) => {
    for (let k = 0; k < cnt; k++) {
      const d = pool[p++ % pool.length], q = { stage: si, d };
      if (si === 0) q.opts = shuffle([d, ...shuffle(DATA.filter(x => x.id !== d.id && x.hard === d.hard)).slice(0, 3)]);
      qs.push(q);
    }
  });
  Q = { node: n, qs, i: 0, pts: 0, total: plan.reduce((a, c, i) => a + c * STAGES[i].w, 0), log: [], answered: false };
  logDay(); save();
  renderQuiz();
}
function renderQuiz() {
  if (Q.i >= Q.qs.length) return quizResult();
  const q = Q.qs[Q.i], d = q.d, st = STAGES[q.stage];
  let body = '';
  if (q.stage === 0) {
    body = `<div class="qtext">다음 고사성어의 뜻으로 알맞은 것은?<br><span class="disp" style="font-size:40px;color:var(--blue)">${d.w}</span> <span class="hanja" style="font-size:22px">${d.h}</span></div>
      <div class="opts">${q.opts.map((o, k) => `<button class="opt" id="o${k}" onclick="checkMC(${k})">${k + 1}. ${esc(o.m)}</button>`).join('')}</div>`;
  } else if (q.stage < 3) {
    body = `<div class="qtext">뜻을 읽고 알맞은 고사성어를 쓰세요.<br><span style="color:#14633b">“${esc(d.m)}”</span></div>

function renderDict() {
  $('#app').innerHTML = `
  <h2 class="sec-title">📖 고사성어 사전 (${DATA.length}개)</h2>
  <div class="ztabs" style="margin-top:0">${[['all', '전체'], ['easy', '🏁 서킷 리그(중학)'], ['hard', '⛰️ 하드 코스(고등)']].map(([k, l]) => `<button class="${DICT_F === k ? 'on' : ''}" onclick="DICT_F='${k}';renderDict()">${l}</button>`).join('')}</div>
  <input class="inp" id="dq" placeholder="고사성어, 한자, 뜻으로 검색" oninput="renderDictList(this.value)" style="margin-bottom:14px">
  <div class="dict" id="dlist"></div>`;
  renderDictList('');
}
function renderDictList(q) {
  const u = me();
  const list = DATA.filter(d => (DICT_F === 'all' || (DICT_F === 'hard') === d.hard) && (!q || [d.w, d.h, d.m, d.l].some(t => t.includes(q))));
  $('#dlist').innerHTML = list.map(d => `<div class="ditem" onclick="showCard(${d.id})">
    <div class="row" style="justify-content:space-between"><h3>${d.w}</h3>${u.known[d.w] ? '<span class="chip ok">알아요</span>' : ''}</div>
    <div class="hj">${d.h}</div><p><b>${esc(d.m)}</b></p><p class="muted">코스 ${Math.floor(d.id / SET_SIZE) + 1}${d.hard ? ' · 하드' : ''}</p></div>`).join('') || '<p style="color:#fff">검색 결과가 없어요.</p>';
}
function showCard(id) {
  $('#layer').innerHTML = `<div class="modal" onclick="if(event.target===this)this.remove()"><div class="panel">${cardBack(DATA[id])}
    <div style="margin-top:14px"><button class="btn w" style="width:100%" onclick="this.closest('.modal').remove()">닫기</button></div></div></div>`;
}

// ===== 효과 =====
function burst() {
  const c = document.createElement('div'); c.className = 'confetti';
  const cols = ['#ffd23f', '#ff4d5e', '#2f7cff', '#2fc37a', '#8b5cf6', '#ff7a3d'];
  for (let i = 0; i < 80; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = cols[i % cols.length];
    p.style.animationDuration = 1.6 + Math.random() * 1.8 + 's';
    p.style.animationDelay = Math.random() * .4 + 's';
    c.appendChild(p);
  }
  document.body.appendChild(c); setTimeout(() => c.remove(), 4200);
}

document.addEventListener('keydown', e => {
  if (VIEW !== 'study' || !S || !S.queue.length || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); flipCard(); }
  if (e.key === 'ArrowRight') answerCard(true);
  if (e.key === 'ArrowLeft') answerCard(false);
});

if (me()) go('home'); else renderLogin();
if (SYNC && Object.keys(DB.users).length) fetchRace(); // 접속할 때 선생님의 기록 삭제 여부 확인
</script>
</body>
</html>
